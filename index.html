<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CYBER NANNY · 赛博保姆</title>
<meta name="description" content="赛博保姆：离线可用的打卡 / 任务 / 番茄钟 / 久坐提醒 / 积分惩罚 / 日报工具，带四档人格与二次元立绘表情差分。" />
<link rel="icon" type="image/webp" href="assets/nanny-normal.webp" />
<meta property="og:title" content="CYBER NANNY · 赛博保姆" />
<meta property="og:description" content="会盯着你干活的赛博保姆。四档人格，四种表情。" />
<meta property="og:image" content="assets/nanny-normal.webp" />
<style>
  :root{
    --bg:#f4f5fa;
    --panel:#ffffff;
    --ink:#12141c;
    --ink-2:#4a4f60;
    --ink-3:#8b90a3;
    --line:#e6e8f0;
    --accent:#5546ff;
    --accent-soft:#eeecff;
    --cyan:#00b3a4;
    --danger:#e5484d;
    --danger-soft:#ffedee;
    --warn:#f0a020;
    --ok:#12a150;
    --radius:16px;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 500px at 12% -10%, #e8e6ff 0%, transparent 60%),
      radial-gradient(700px 400px at 92% 0%, #dff8f5 0%, transparent 55%),
      linear-gradient(#f7f8fc,#f2f3f9 60%,#f5f6fb);
    color:var(--ink);
    min-height:100vh;
    padding:22px 18px 80px;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(85,70,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(85,70,255,.045) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 75%);
  }
  .wrap{max-width:1120px;margin:0 auto;position:relative;z-index:1}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:rgba(255,255,255,.82);
    border:1px solid var(--line);
    border-radius:14px;padding:12px 16px;
    box-shadow:0 1px 2px rgba(18,20,28,.04),0 12px 28px -18px rgba(18,20,28,.22);
    backdrop-filter:blur(10px);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .logo{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(140deg,#5546ff,#8f7dff 55%,#00b3a4);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;
    box-shadow:0 6px 16px -6px rgba(85,70,255,.7);
    letter-spacing:.5px;
  }
  .brand h1{font-size:15px;letter-spacing:.4px;font-weight:750}
  .brand span{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:1.6px;margin-top:1px}
  .clock{font-family:var(--mono);font-size:13px;color:var(--ink-2);letter-spacing:.6px}
  .clock b{color:var(--ink);font-weight:700}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:6px 12px;font-size:12px;color:var(--ink-2);cursor:pointer;
    transition:.16s;
  }
  .chip:hover{border-color:#cfd2e0;transform:translateY(-1px)}
  .points{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--accent-soft);border:1px solid #ddd8ff;color:#3a2ee0;
    border-radius:999px;padding:7px 14px;font-weight:750;font-size:13px;
  }
  .points em{font-family:var(--mono);font-style:normal;font-size:15px}
  .points.neg{background:var(--danger-soft);border-color:#ffd5d7;color:#c0252a}

  /* ---------- hero ---------- */
  .hero{
    margin-top:16px;display:grid;grid-template-columns:132px 1fr;gap:20px;
    background:linear-gradient(180deg,#fff,#fdfdff);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;position:relative;overflow:hidden;
    box-shadow:0 1px 2px rgba(18,20,28,.04),0 26px 50px -34px rgba(18,20,28,.35);
  }
  .hero::after{
    content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(85,70,255,.10),transparent 68%);
  }
  .avatar{position:relative;width:136px;height:136px;display:grid;place-items:center;justify-self:center}
  .char{
    width:136px;height:136px;border-radius:50%;object-fit:cover;object-position:50% 16%;
    background:#f5f4f7;
    border:3px solid #fff;
    box-shadow:0 0 0 1.5px #e6e8f0,0 16px 32px -16px rgba(85,70,255,.6);
    animation:float 5.5s ease-in-out infinite;
    transition:filter .3s;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .char.swap{animation:swap .34s cubic-bezier(.3,1.5,.5,1),float 5.5s ease-in-out infinite}
  @keyframes swap{0%{transform:scale(.92) rotate(-2deg);opacity:.55}100%{transform:scale(1) rotate(0);opacity:1}}
  .char[data-expr="angry"]{box-shadow:0 0 0 1.5px #ffd0d2,0 16px 32px -16px rgba(229,72,77,.6)}
  .char[data-expr="happy"]{box-shadow:0 0 0 1.5px #cfc8ff,0 16px 32px -16px rgba(85,70,255,.6)}
  .char-fallback{display:none}
  .char-fallback svg{width:118px;height:118px;filter:drop-shadow(0 12px 22px rgba(85,70,255,.22))}
  .avatar.noimg .char{display:none}
  .avatar.noimg .char-fallback{display:grid;place-items:center}
  .expr-tag{
    position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;color:#fff;background:#12141c;
    padding:2.5px 9px;border-radius:99px;opacity:.9;white-space:nowrap;pointer-events:none;
  }
  .eyes{animation:blink 5.6s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}98%{transform:scaleY(1)}}
  .scan{animation:scan 3.4s ease-in-out infinite}
  @keyframes scan{0%,100%{opacity:.25}50%{opacity:.85}}
  .speech{display:flex;flex-direction:column;justify-content:center;gap:12px;position:relative;z-index:1}
  .bubble{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;font-size:16px;line-height:1.62;font-weight:600;
    box-shadow:0 10px 26px -22px rgba(18,20,28,.6);
    position:relative;min-height:66px;display:flex;align-items:center;
  }
  .bubble::before{
    content:"";position:absolute;left:-7px;top:26px;width:12px;height:12px;background:#fff;
    border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);
  }
  .bubble.flash{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(.98);opacity:.4}100%{transform:scale(1);opacity:1}}
  .quick{display:flex;gap:8px;flex-wrap:wrap}
  .quick button{
    font:inherit;font-size:12.5px;padding:8px 14px;border-radius:10px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:.15s;
  }
  .quick button:hover{background:var(--accent-soft);border-color:#d8d2ff;color:#3a2ee0}
  .quick button:active{transform:scale(.97)}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:16px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;
    box-shadow:0 1px 2px rgba(18,20,28,.04),0 18px 40px -34px rgba(18,20,28,.4);
  }
  .card h2{
    font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);
    font-weight:750;display:flex;align-items:center;gap:8px;margin-bottom:14px;
  }
  .card h2 svg{width:14px;height:14px;stroke:var(--accent)}
  .card h2 .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;font-size:11px;color:var(--ink-3)}
  .span-7{grid-column:span 7}
  .span-5{grid-column:span 5}
  .span-4{grid-column:span 4}
  .span-6{grid-column:span 6}
  .span-12{grid-column:span 12}

  /* tasks */
  .task-add{display:flex;gap:8px;margin-bottom:12px}
  .task-add input[type=text]{
    flex:1;min-width:0;font:inherit;font-size:13px;padding:9px 12px;border-radius:10px;
    border:1px solid var(--line);background:#fafbfe;color:var(--ink);outline:none;transition:.15s;
  }
  .task-add input[type=text]:focus{border-color:#bdb4ff;background:#fff;box-shadow:0 0 0 3px rgba(85,70,255,.09)}
  .task-add input[type=datetime-local]{
    font:inherit;font-family:var(--mono);font-size:11.5px;padding:8px 8px;border-radius:10px;
    border:1px solid var(--line);background:#fafbfe;color:var(--ink-2);outline:none;width:172px;
  }
  .btn{
    font:inherit;font-size:13px;font-weight:650;padding:9px 16px;border-radius:10px;border:1px solid transparent;
    background:var(--accent);color:#fff;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .btn:hover{background:#4636f2;transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink-2)}
  .btn.ghost:hover{background:#f7f8fc;border-color:#cfd2e0}
  .btn.tiny{font-size:11.5px;padding:6px 11px;border-radius:8px}

  .tasks{display:flex;flex-direction:column;gap:8px;max-height:264px;overflow:auto}
  .tasks::-webkit-scrollbar{width:6px}
  .tasks::-webkit-scrollbar-thumb{background:#dcdeea;border-radius:99px}
  .task{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;
    border:1px solid var(--line);background:#fcfcff;transition:.15s;
  }
  .task:hover{border-color:#d6d8e6}
  .task.done{opacity:.5}
  .task.done .t-title{text-decoration:line-through}
  .task.overdue{border-color:#ffd0d2;background:var(--danger-soft)}
  .tick{
    width:19px;height:19px;flex:none;border-radius:6px;border:1.6px solid #c8cbdb;background:#fff;
    cursor:pointer;display:grid;place-items:center;transition:.15s;position:relative;
  }
  .tick:hover{border-color:var(--accent)}
  .task.done .tick{background:var(--accent);border-color:var(--accent)}
  .tick svg{width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transition:.15s}
  .task.done .tick svg{opacity:1}
  .t-body{flex:1;min-width:0}
  .t-title{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t-due{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px}
  .task.overdue .t-due{color:var(--danger);font-weight:700}
  .del{
    border:none;background:transparent;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;
    padding:2px 4px;border-radius:6px;opacity:0;transition:.15s;
  }
  .task:hover .del{opacity:1}
  .del:hover{color:var(--danger);background:var(--danger-soft)}
  .empty{text-align:center;color:var(--ink-3);font-size:12.5px;padding:26px 0}

  /* pomodoro */
  .pomo{display:flex;align-items:center;gap:20px}
  .ring{position:relative;width:126px;height:126px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .track{stroke:#eceef6;stroke-width:9;fill:none}
  .ring .prog{stroke:url(#pg);stroke-width:9;fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
  .ring-mid{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  }
  .ring-mid .mm{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.5px}
  .ring-mid .ss{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
  .pomo-side{flex:1;display:flex;flex-direction:column;gap:10px}
  .pomo-side .row{display:flex;gap:8px}
  .stat-line{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);padding:6px 0;border-bottom:1px dashed var(--line)}
  .stat-line:last-child{border-bottom:none}
  .stat-line b{font-family:var(--mono);font-weight:700;color:var(--ink)}

  /* habits */
  .habits{display:flex;flex-direction:column;gap:10px}
  .habit{
    display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;
    border:1px solid var(--line);background:#fcfcff;cursor:pointer;transition:.15s;user-select:none;
  }
  .habit:hover{border-color:#d6d8e6;background:#f8f9ff}
  .habit .del{opacity:1;color:var(--ink-3)}
  .habit .del:hover{color:var(--danger);background:var(--danger-soft)}
  .habit-add{display:flex;gap:8px;margin-top:14px}
  .habit-add input{
    flex:1;min-width:0;font:inherit;font-size:12.5px;padding:8px 12px;border-radius:10px;
    border:1px solid var(--line);background:#fafbfe;color:var(--ink);outline:none;transition:.15s;
  }
  .habit-add input:focus{border-color:#bdb4ff;background:#fff;box-shadow:0 0 0 3px rgba(85,70,255,.09)}
  .habit.on{border-color:#cfc8ff;background:linear-gradient(90deg,#f6f4ff,#fdfdff)}
  .h-ico{
    width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:#eef0f8;color:var(--ink-2);transition:.15s;
  }
  .habit.on .h-ico{background:var(--accent);color:#fff}
  .h-ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .h-name{flex:1;font-size:13px;font-weight:600}
  .h-name small{display:block;font-weight:500;font-size:10.5px;color:var(--ink-3);margin-top:1px;font-family:var(--mono)}
  .h-val{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-weight:700}
  .habit.on .h-val{color:var(--accent)}

  /* water */
  .cups{display:flex;gap:7px;margin-top:12px}
  .cup{
    flex:1;height:40px;border-radius:8px;border:1.6px solid #dfe2ee;background:#fafbfe;
    cursor:pointer;position:relative;overflow:hidden;transition:.16s;
  }
  .cup::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:0;
    background:linear-gradient(180deg,#63d9f0,#2aa8e0);transition:height .3s cubic-bezier(.4,1.6,.5,1);
  }
  .cup.on{border-color:#7dd0ee}
  .cup.on::after{height:100%}
  .cup:hover{border-color:#9dc4e8}
  .cup span{
    position:absolute;inset:0;display:grid;place-items:center;z-index:1;
    font-family:var(--mono);font-size:10px;color:#c3c8d8;transition:color .2s;
  }
  .cup.on span{color:#fff;text-shadow:0 1px 2px rgba(0,60,90,.35)}

  /* metrics */
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .metric{
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fcfcff;
  }
  .metric .k{font-size:11px;color:var(--ink-3);letter-spacing:.4px}
  .metric .v{font-family:var(--mono);font-size:22px;font-weight:750;margin-top:4px;letter-spacing:-.5px}
  .metric .v small{font-size:11px;color:var(--ink-3);font-weight:500;margin-left:2px}
  .metric.warn .v{color:var(--danger)}
  .metric.good .v{color:var(--ok)}

  /* chart */
  .bars{display:flex;align-items:flex-end;gap:10px;height:110px;padding-top:6px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
  .bar-track{flex:1;width:100%;position:relative;border-radius:6px;background:#f4f5fa;overflow:hidden}
  .bar{
    position:absolute;left:0;right:0;bottom:0;
    border-radius:6px;background:linear-gradient(180deg,#8f7dff,#5546ff);
    transition:height .5s cubic-bezier(.3,1.4,.5,1);min-height:3px;
  }
  .bar.today{background:linear-gradient(180deg,#3fd6c4,#00b3a4)}
  .bar-col .lbl{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
  .bar-col .val{font-family:var(--mono);font-size:10px;color:var(--ink-2);font-weight:700}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--ink-3);margin-top:10px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}

  /* report */
  .report{
    font-size:13px;line-height:1.85;color:var(--ink-2);white-space:pre-wrap;
    background:#fafbff;border:1px dashed #dfe1f0;border-radius:12px;padding:14px 16px;
    font-family:var(--mono);font-size:12px;
  }
  .report b{color:var(--ink);font-weight:700}

  /* settings */
  .settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11px;color:var(--ink-3);letter-spacing:.3px}
  .field input,.field select{
    font:inherit;font-family:var(--mono);font-size:12.5px;padding:8px 10px;border-radius:9px;
    border:1px solid var(--line);background:#fafbfe;color:var(--ink);outline:none;
  }
  .field input:focus,.field select:focus{border-color:#bdb4ff;box-shadow:0 0 0 3px rgba(85,70,255,.09)}
  .switch{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:12.5px;color:var(--ink-2);padding-top:18px}
  .sw{width:38px;height:22px;border-radius:99px;background:#dfe2ee;position:relative;transition:.2s;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch.on .sw{background:var(--accent)}
  .switch.on .sw::after{left:18px}

  /* toast */
  .foot{
    display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;align-items:center;
    margin-top:22px;font-size:11.5px;color:var(--ink-3);text-align:center;
  }
  .foot span{white-space:nowrap}
  .foot span+span::before{content:"·";margin-right:18px;color:#d3d6e4}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:#12141c;color:#fff;font-size:13px;padding:11px 20px;border-radius:11px;
    box-shadow:0 18px 40px -14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.24s;z-index:99;
    display:flex;align-items:center;gap:9px;max-width:min(92vw,520px);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast .dot{width:7px;height:7px;border-radius:50%;background:#3fd6c4;flex:none;animation:scan 1.6s infinite}

  @media (max-width:900px){
    .span-7,.span-5,.span-4,.span-6{grid-column:span 12}
    .hero{grid-template-columns:1fr;text-align:center;gap:14px}
    .avatar{justify-self:center}
    .bubble::before{display:none}
    .quick{justify-content:center}
    .pomo{flex-direction:column}
    .task-add input[type=datetime-local]{width:100%}
    .task-add{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">CN</div>
      <div>
        <h1>赛博保姆</h1>
        <span>CYBER NANNY v1.1</span>
      </div>
    </div>
    <div class="clock"><b id="clock">--:--</b> <span id="datestr"></span></div>
    <div class="chip" id="personaBtn" title="切换保姆人格">
      <span style="width:6px;height:6px;border-radius:50%;background:#5546ff"></span>
      <span id="personaName">毒舌总管</span>
    </div>
    <div class="points" id="pointBox"><em id="pointsVal">0</em> 分</div>
  </div>

  <div class="hero">
    <div class="avatar">
      <img id="charImg" class="char" src="assets/nanny-normal.webp" alt="赛博保姆 · 诺诺" width="132" height="132" />
      <div class="char-fallback" id="charFallback">
        <svg viewBox="0 0 120 120">
          <defs>
            <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#6f5bff"/><stop offset="100%" stop-color="#00b3a4"/>
            </linearGradient>
            <linearGradient id="gF" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef0ff"/>
            </linearGradient>
          </defs>
          <rect x="16" y="10" width="88" height="88" rx="26" fill="none" stroke="url(#gA)" stroke-width="2.5" opacity=".55"/>
          <rect x="24" y="20" width="72" height="66" rx="20" fill="url(#gF)" stroke="url(#gA)" stroke-width="2.5"/>

<script>

/* ---------- 立绘：表情差分 ---------- */
const CHARS = {
  normal: { src: 'assets/nanny-normal.webp', tag: '待机' },
  happy:  { src: 'assets/nanny-happy.webp',  tag: '满意' },
  angry:  { src: 'assets/nanny-angry.webp',  tag: '训话' },
  sleepy: { src: 'assets/nanny-sleepy.webp', tag: '犯困' }
};
const EXPR_OF = {
  greet: 'normal', praise: 'happy', water: 'happy', wake: 'happy',
  nag: 'angry', overdue: 'angry', slack: 'angry',
  sleep: 'sleepy', focus: 'normal', idle: 'normal'
};
let curExpr = '';
let exprTimer = null;

function setExpr(name, hold){
  const c = CHARS[name] ? name : 'normal';
  const img = document.getElementById('charImg');
  if(!img) return;
  if(curExpr !== c){
    img.setAttribute('src', CHARS[c].src);
    img.setAttribute('data-expr', c);
    img.classList.remove('swap');
    void img.offsetWidth;
    img.classList.add('swap');
    curExpr = c;
  }
  const tag = document.getElementById('exprTag');
  if(tag) tag.textContent = CHARS[c].tag;
  clearTimeout(exprTimer);
  if(hold > 0) exprTimer = setTimeout(() => setExpr('normal', 0), hold);
}

/* ---------- 状态 ---------- */
function dkey(d = new Date()){
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function defaultDaily(){
  return { date: dkey(), points: 0, water: 0, focusMin: 0, pomos: 0,
           wake: false, exercise: false, read: false, sleep: false,
           sitAt: Date.now(), lastStand: Date.now() };
}
function defaultHabits(){
  return [
    { id:'wake',     name:'按时起床',    icon:'sun',  points:15 },
    { id:'exercise', name:'运动 20 分钟', icon:'bolt', points:10 },
    { id:'read',     name:'阅读 / 学习',  icon:'book', points:10 },
    { id:'sleep',    name:'按时睡觉',    icon:'moon', points:10 }
  ];
}
const DEFAULT_STATE = {
  persona: 'savage',
  daily: defaultDaily(),
  tasks: [],
  archive: {},
  totalPoints: 0,
  settings: {
    wake: '07:00', sleep: '23:30', waterGoal: 8, sitMin: 45, voice: false,
    habits: defaultHabits(),
    pomo: { focus: 25, short: 5, long: 15, longAfter: 4 }
  },
  pomo: { phase:'focus', total:25*60, remain:25*60, running:false, round:0,
          savedAt:Date.now(), lastFocusTotal:25*60 }
};
let state = load();
let demoMode = false;   // ?demo=1 时开启，不写盘

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(DEFAULT_STATE);
    let s = Object.assign(structuredClone(DEFAULT_STATE), JSON.parse(raw));
    s.settings = Object.assign({}, DEFAULT_STATE.settings, s.settings || {});
    if(!Array.isArray(s.settings.habits) || !s.settings.habits.length) s.settings.habits = defaultHabits();
    s.settings.pomo = Object.assign({}, DEFAULT_STATE.settings.pomo, s.settings.pomo || {});
    s.pomo = Object.assign({}, structuredClone(DEFAULT_STATE.pomo), s.pomo || {});
    s.archive = s.archive || {};
    s.tasks = s.tasks || [];
    if(!s.daily || s.daily.date !== dkey()) s = rollover(s);
    return s;
  }catch(e){ return structuredClone(DEFAULT_STATE); }
}
function rollover(s){
  const oldDate = s.daily && s.daily.date ? s.daily.date : dkey();
  const old = { ...s.daily };
  delete old.sitAt; delete old.lastStand; delete old.date; delete old.date_key;
  if(s.archive[oldDate] === undefined && (old.points || old.water || old.focusMin)){
    s.archive[oldDate] = old;
  }
  s.daily = defaultDaily();
  s.tasks = (s.tasks || []).filter(t => !t.done);
  return s;
}
function save(){ if(demoMode) return; localStorage.setItem(KEY, JSON.stringify(state)); }

/* ---------- 说话 ---------- */
let lastSpeak = 0;
function say(cat, opts = {}){
  const now = Date.now();
  if(!opts.force && now - lastSpeak < 1200) return;
  lastSpeak = now;
  const p = PERSONAS[state.persona] || PERSONAS.savage;
  const pool = p[cat] || p.idle;
  const line = pool[Math.floor(Math.random() * pool.length)];
  const b = $('#bubble');
  b.classList.remove('flash');
  void b.offsetWidth;
  b.textContent = line;
  b.classList.add('flash');
  setExpr(EXPR_OF[cat] || 'normal', cat === 'praise' || cat === 'water' ? 3200 : 4600);
  if(state.settings.voice) speak(line, p);
}
function speak(text, p){
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.pitch = p.pitch; u.rate = p.rate; u.volume = 1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function toast(msg){
  const t = $('#toast');
  $('#toastTxt').textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2100);
}

/* ---------- 积分 ---------- */
const PTS = { habit: 10, wake: 15, water: 3, pomo: 10, task: 10, overdue: -12 };
function addPoints(n, reason){
  state.daily.points += n;
  state.totalPoints = (state.totalPoints || 0) + n;
  save(); renderPoints();
  toast((n > 0 ? '+' : '') + n + ' 分 · ' + reason);
}
function deduct(n, reason){
  state.daily.points -= n;
  state.totalPoints = (state.totalPoints || 0) - n;
  save(); renderPoints(); renderReport();
  toast('-' + n + ' 分 · ' + reason);
}

/* ---------- 渲染：顶栏 ---------- */
function renderPoints(){
  const v = $('#pointsVal'), box = $('#pointBox');
  v.textContent = state.daily.points;
  box.classList.toggle('neg', state.daily.points < 0);
}

/* ---------- 渲染：任务 ---------- */
function fmtDue(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const p = n => String(n).padStart(2,'0');
  const today = dkey(d) === dkey();
  return (today ? '今天 ' : `${d.getMonth()+1}/${d.getDate()} `) + `${p(d.getHours())}:${p(d.getMinutes())}`;
}
function isOverdue(t){
  return !t.done && t.due && new Date(t.due).getTime() < Date.now();
}
function renderTasks(){
  const box = $('#taskList');
  const list = state.tasks;
  if(!list.length){
    box.innerHTML = '<div class="empty">列表是空的。空列表不叫休息，叫逃避。</div>';
  }else{
    box.innerHTML = list.map(t => `
      <div class="task ${t.done?'done':''} ${isOverdue(t)?'overdue':''}" data-id="${t.id}">
        <div class="tick" data-act="toggle">
          <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="t-body">
          <div class="t-title">${escapeHtml(t.title)}</div>
          ${t.due ? `<div class="t-due">${isOverdue(t) ? '已逾期 · ' : '截止 '}${fmtDue(t.due)}</div>` : ''}
        </div>
        <button class="del" data-act="del" title="删除">&times;</button>
      </div>`).join('');
  }
  const done = list.filter(t => t.done).length;

/* ---------- 渲染：指标 + 图表 ---------- */
function renderMetrics(){
  const tasks = state.tasks;
  const done = tasks.filter(t => t.done).length;
  const rate = tasks.length ? Math.round(done / tasks.length * 100) : 0;

  $('#mPoints').textContent = state.daily.points;
  $('#mRate').innerHTML = rate + '<small>%</small>';
  $('#mStreak').innerHTML = streak() + '<small>天</small>';

  // 距睡觉
  const now = new Date();
  const [sh, sm] = (state.settings.sleep || '23:30').split(':').map(Number);
  const sleepAt = new Date(now); sleepAt.setHours(sh, sm, 0, 0);
  let diff = (sleepAt - now) / 60000;
  if(diff < 0) diff += 1440;
  const h = Math.floor(diff / 60), m = Math.round(diff % 60);
  $('#mSleep').innerHTML = diff < 60 ? `${m}<small>分</small>` : `${h}<small>时</small>${m}<small>分</small>`;
  const sleepEl = $('#mSleep').closest('.metric');
  sleepEl.classList.toggle('warn', diff < 60 && !state.daily.sleep);
  sleepEl.classList.toggle('good', !!state.daily.sleep);

  $('#focusMinTxt').textContent = state.daily.focusMin + ' 分钟';
  $('#pomoCountTxt').textContent = state.daily.pomos + ' 个';

  const ptsEl = $('#mPoints').closest('.metric');
  ptsEl.classList.toggle('warn', state.daily.points < 0);
  ptsEl.classList.toggle('good', state.daily.points >= 60);

  // 评级
  const score = habitScore();
  const g = score >= 85 ? 'S 级 · 可以了' : score >= 65 ? 'A 级 · 还行' : score >= 40 ? 'B 级 · 一般' : 'C 级 · 危险';
  $('#gradeHint').textContent = g;
}
function habitScore(){
  const goal = state.settings.waterGoal || 8;
  const habits = state.settings.habits || [];
  const items = habits.map(h => state.daily[h.id] ? 1 : 0).concat([Math.min(1, state.daily.water / goal)]);
  const tasks = state.tasks;
  const taskRate = tasks.length ? tasks.filter(t => t.done).length / tasks.length : 0;
  const base = items.reduce((a, b) => a + b, 0) / items.length;
  return Math.round((base * 0.7 + taskRate * 0.3) * 100);
}
function streak(){
  let n = 0;
  const d = new Date();
  const habits = state.settings.habits || [];
  if(habitScore() >= 60) n = 1;
  for(let i = 1; i <= 60; i++){
    const dd = new Date(d); dd.setDate(d.getDate() - i);
    const rec = state.archive[dkey(dd)];
    if(!rec) break;
    const goal = state.settings.waterGoal || 8;
    const items = habits.map(h => !!rec[h.id]).concat([Math.min(1, (rec.water || 0) / goal)]);
    const base = items.reduce((a, b) => a + b, 0) / items.length;
    if(base >= 0.6) n++; else break;
  }
  return n;
}
function renderBars(){
  const days = [];
  const now = new Date();
  for(let i = 6; i >= 0; i--){
    const d = new Date(now); d.setDate(now.getDate() - i);
    const k = dkey(d);
    let pts = 0;
    if(i === 0) pts = Math.max(0, state.daily.points);
    else pts = Math.max(0, (state.archive[k] && state.archive[k].points) || 0);
    days.push({ k, pts, lbl: '日一二三四五六'[d.getDay()], today: i === 0 });
  }
  const max = Math.max(30, ...days.map(d => d.pts));
  $('#bars').innerHTML = days.map(d => `
    <div class="bar-col">
      <div class="val">${d.pts || ''}</div>
      <div class="bar-track"><div class="bar ${d.today?'today':''}" style="height:${Math.max(3, d.pts / max * 100)}%"></div></div>
      <div class="lbl">${d.today ? '今' : d.lbl}</div>
    </div>`).join('');
}

function renderReport(){
  const d = new Date();

  const overdue = tasks.filter(isOverdue).length;

  const lines = [
    `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} 保姆日报`,
    `积分 ${state.daily.points} · 完成度 ${score}% · 连续达标 ${streak()} 天`,
    `打卡：${habits.length ? habits.join('、') : '一项都没打'}`,
    `喝水：${state.daily.water}/${goal} 杯 · 专注：${state.daily.focusMin} 分钟（${state.daily.pomos} 个番茄）`,
    `任务：${done}/${tasks.length} 完成${overdue ? `，${overdue} 项逾期` : ''}`
  ];
  const verdicts = score >= 85
    ? ['结论：今天无可挑剔。保持这个节奏，别明天就打回原形。']
    : score >= 60
    ? ['结论：勉强过关。差的那几项，明天补上。']
    : score >= 30

    : ['结论：今天基本报废。别自责了，现在起来做一件小事，还来得及。'];
  lines.push('');

  $('#report').textContent = lines.join('\n');
}

/* ---------- 番茄钟（工作-休息循环，状态可跨刷新恢复） ---------- */
let pomoTid = null;

function renderPomo(){
  const p = state.pomo;
  const m = Math.floor(p.remain / 60), s = p.remain % 60;
  $('#pomoTime').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  $('#pomoState').textContent = p.running
    ? (p.phase === 'break' ? '休息中' : '专注中')
    : (p.remain === p.total ? '就绪' : '已暂停');
  $('#pomoStart').textContent = p.running ? '暂停' : (p.remain === p.total ? (p.phase === 'break' ? '开始休息' : '开始专注') : '继续');
  $('#pomoHint').textContent = p.phase === 'break' ? '休息中' : (p.running ? '专注中' : (p.remain === p.total ? '待命' : '已暂停'));
  const C = 2 * Math.PI * 54;
  const ratio = 1 - p.remain / p.total;
  $('#ringProg').style.strokeDashoffset = String(-C * ratio);
}
function pomoSave(){ if(demoMode) return; state.pomo.savedAt = Date.now(); save(); }

function pomoComplete(){
  const p = state.pomo;
  clearInterval(pomoTid); pomoTid = null;
  p.running = false;
  const cfg = state.settings.pomo || {};
  if(p.phase === 'focus'){
    const mins = Math.round(p.total / 60);
    state.daily.focusMin += mins;
    state.daily.pomos += 1;
    addPoints(PTS.pomo, '专注完成');
    p.round += 1;
    const longAfter = cfg.longAfter || 4;
    const isLong = p.round % longAfter === 0;
    p.phase = 'break';
    p.total = (isLong ? (cfg.long||15) : (cfg.short||5)) * 60;
    p.remain = p.total;
    toast(isLong ? `完成 ${mins} 分钟专注，进入 ${cfg.long||15} 分钟长休息` : `专注完成 +${PTS.pomo} 分，休息 ${cfg.short||5} 分钟`);
    beep();
    p.running = true;
    pomoTid = setInterval(pomoTick, 1000);
  }else{
    p.phase = 'focus';
    p.total = p.lastFocusTotal || (cfg.focus||25) * 60;
    p.remain = p.total;
    toast('休息结束，开始下一轮专注');
    say('focus', { force: true });
    beep();
  }
  pomoSave(); renderPomo(); renderMetrics(); renderReport();
}

function pomoTick(){
  const p = state.pomo;
  if(!p.running) return;
  p.remain--;
  if(p.remain <= 0){ p.remain = 0; pomoComplete(); return; }
  renderPomo();
  if(p.remain % 10 === 0) pomoSave(); // 每 10 秒落盘，防刷新丢进度
}
$('#pomoStart').addEventListener('click', () => {
  const p = state.pomo;
  if(p.running){
    p.running = false;
    clearInterval(pomoTid); pomoTid = null;
    pomoSave();
  }else{
    if(p.remain <= 0) p.remain = p.total;
    p.running = true;
    pomoTid = setInterval(pomoTick, 1000);
    say(p.phase === 'break' ? 'water' : 'focus', { force: true });
  }
  renderPomo();
});
$('#pomoReset').addEventListener('click', () => {
  clearInterval(pomoTid); pomoTid = null;
  const p = state.pomo;
  p.running = false;
  p.phase = 'focus';
  p.total = p.lastFocusTotal || (state.settings.pomo?.focus||25) * 60;
  p.remain = p.total;
  pomoSave(); renderPomo();
});
document.querySelectorAll('[data-focus]').forEach(b => {
  b.addEventListener('click', () => {
    clearInterval(pomoTid); pomoTid = null;
    const p = state.pomo;
    p.running = false;
    p.phase = 'focus';
    p.total = Number(b.dataset.focus) * 60;
    p.lastFocusTotal = p.total;
    p.remain = p.total;
    pomoSave(); renderPomo();
  });
});
function restorePomo(){
  const p = state.pomo;
  if(p.running){
    const elapsed = Math.floor((Date.now() - (p.savedAt || Date.now())) / 1000);
    if(elapsed > 0){
      p.remain -= elapsed;
      if(p.remain <= 0){          // 离线期间已走完：不自动结算，重置为就绪
        p.running = false;
        p.remain = p.total;
        toast('离线期间专注计时已结束，已重置为就绪');
      }
    }
    if(p.running){ pomoTid = setInterval(pomoTick, 1000); }
  }
}
function beep(){
  try{
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18, 0.36].forEach((t, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = [660, 880, 1046][i];
      g.gain.setValueAtTime(0.0001, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.16, ac.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.16);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.18);
    });
  }catch(e){}
}

/* ---------- 保姆主动监督 ---------- */
function currentNagCat(){
  const now = new Date();
  const overdue = state.tasks.filter(isOverdue).length;
  const goal = state.settings.waterGoal || 8;
  const sitMin = (Date.now() - (state.daily.lastStand || Date.now())) / 60000;
  const [sh, sm] = (state.settings.sleep || '23:30').split(':').map(Number);
  const sleepAt = new Date(now); sleepAt.setHours(sh, sm, 0, 0);
  let toSleep = (sleepAt - now) / 60000; if(toSleep < 0) toSleep += 1440;

  if(overdue) return 'overdue';
  if(toSleep < 60 && !state.daily.sleep) return 'sleep';
  if(sitMin > (state.settings.sitMin || 45)) return 'idle';
  if(state.daily.water < goal * 0.5 && now.getHours() >= 14) return 'water';
  if(state.tasks.some(t => !t.done)) return 'nag';
  return 'nag';
}
let nagTid = null;
function startNag(){
  clearInterval(nagTid);
  nagTid = setInterval(() => {
    const cat = currentNagCat();
    say(cat);
    // 久坐强制提醒
    const sitMin = (Date.now() - (state.daily.lastStand || Date.now())) / 60000;
    if(sitMin > (state.settings.sitMin || 45) && !document.hidden){
      beep();
      toast(`已连续坐 ${Math.round(sitMin)} 分钟 · 起来动一下`);
    }
    // 逾期检测
    state.tasks.forEach(t => {
      if(isOverdue(t) && !t._nagged){
        t._nagged = true;
        deduct(Math.abs(PTS.overdue), '任务逾期：' + t.title);
        renderTasks();
      }
    });
  }, 75000);
}

    e.target.value = s.sitMin; save();
  });
  $('#voiceSwitch').addEventListener('click', () => {
    s.voice = !s.voice;
    $('#voiceSwitch').classList.toggle('on', s.voice);
    save();
    if(s.voice) speak('语音已开启。', PERSONAS[state.persona]);
  });
  $('#resetBtn').addEventListener('click', () => {
    if(!confirm('清空所有数据？包括任务、积分和历史记录。')) return;
    localStorage.removeItem(KEY);
    location.reload();
  });
  $('#exportBtn').addEventListener('click', () => {
    const data = { exportedAt: new Date().toISOString(), state };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `cyber-nanny-${dkey()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('数据已导出');
  });
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        let incoming = parsed && parsed.state ? parsed.state : parsed;
        if(!incoming || !incoming.daily || !incoming.settings || !Array.isArray(incoming.tasks)){
          toast('文件格式不对，无法导入'); return;
        }
        incoming.settings = Object.assign({}, DEFAULT_STATE.settings, incoming.settings || {});
        if(!Array.isArray(incoming.settings.habits) || !incoming.settings.habits.length) incoming.settings.habits = defaultHabits();
        incoming.settings.pomo = Object.assign({}, DEFAULT_STATE.settings.pomo, incoming.settings.pomo || {});
        incoming.pomo = Object.assign({}, structuredClone(DEFAULT_STATE.pomo), incoming.pomo || {});
        incoming.archive = incoming.archive || {};
        if(!incoming.daily || incoming.daily.date !== dkey()) incoming = rollover(incoming);
        // 导入后不恢复运行中的计时，避免残留定时器
        clearInterval(pomoTid); pomoTid = null;
        incoming.pomo.running = false;
        incoming.pomo.savedAt = Date.now();
        state = incoming;
        save(); renderAll();
        toast('数据已导入');
      }catch(err){
        toast('导入失败：文件损坏或格式不对');
      }
      e.target.value = '';
    };
    reader.readAsText(f);
  });
  $('#copyReport').addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText($('#report').textContent);
      toast('日报已复制');
    }catch(e){
      const r = document.createRange(); r.selectNode($('#report'));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      document.execCommand('copy');
      toast('日报已复制');
    }
  });
}

/* ---------- 全局渲染 ---------- */
function renderAll(){
  $('#personaName').textContent = PERSONAS[state.persona].name;
  renderPoints(); renderTasks(); renderHabits(); renderPomo();
  renderMetrics(); renderBars(); renderReport();
}

/* ---------- 演示数据（?demo=1）---------- */
function localIso(minOffset){
  const d = new Date(Date.now() + minOffset * 60000);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function seedDemo(){
  demoMode = true;
  state.daily = Object.assign(defaultDaily(), {
    points: 78, water: 5, focusMin: 50, pomos: 2,
    wake: true, exercise: false, read: true, sleep: false
  });
  state.tasks = [
    { id:'d1', title:'交本周周报', due: localIso(-30), done: false },
    { id:'d2', title:'背 30 个单词', due: localIso(90), done: false },
    { id:'d3', title:'复盘上周三个失误', due: '', done: true }
  ];
  const pts = [52, 96, 40, 118, 64, 88];
  const d = new Date();
  for(let i = 6; i >= 1; i--){
    const dd = new Date(d); dd.setDate(d.getDate() - i);
    state.archive[dkey(dd)] = { points: pts[i - 1] || 0, water: 6, focusMin: 50, pomos: 2,
      wake: true, exercise: true, read: true, sleep: true };
  }
}

/* ---------- 启动 ---------- */
(function init(){
  // 立绘：预加载 + 缺失时回落 SVG
  const ci = document.getElementById('charImg');
  if(ci){
    const fail = () => { document.querySelector('.avatar').classList.add('noimg'); };
    ci.addEventListener('error', fail);
    if(ci.complete && ci.naturalWidth === 0) fail();
  }
  try{
    Object.keys(CHARS).forEach(k => { const p = new window.Image(); p.src = CHARS[k].src; });
  }catch(e){}
  const hh = new Date().getHours();
  if(hh >= 23 || hh < 6) setExpr('sleepy', 0);
  if((location.search || '').includes('demo=1')) seedDemo();

  renderAll();
  bindSettings();
  tickClock();
  setInterval(tickClock, 1000);
  startNag();
  restorePomo();
  renderPomo();
  setTimeout(() => say('greet', { force: true }), 600);
  // 首次进入请求语音上下文授权不算必要；保持静默
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden){
      say(currentNagCat());
      renderAll();
    }
  });
})();
</script>
